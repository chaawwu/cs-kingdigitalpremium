<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KingDigitalPremium - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-app">
    <header class="admin-header">
      <h1>Admin Dashboard</h1>
    </header>

    <main class="admin-main card">
      <section id="loginSection">
        <h2>Login Admin</h2>
        <form id="loginForm">
          <label>Email<input id="adminEmail" type="email" required></label>
          <label>Password<input id="adminPassword" type="password" required></label>
          <button class="btn" type="submit">Login</button>
        </form>
      </section>

      <section id="dashboardSection" class="hidden">
        <div class="admin-top">
          <div>
            <input id="searchInput" placeholder="Cari nomor antrian, nama, WA, ID pesanan, produk">
          </div>
          <div>
            <button id="logoutBtn" class="btn ghost">Logout</button>
          </div>
        </div>

        <div class="admin-grid">
          <div class="panel" id="chatsList">
            <h3>Daftar Chat</h3>
            <div id="chatsContainer"></div>
          </div>

          <div class="panel" id="chatView">
            <h3>Chat Room</h3>
            <div id="adminMessages" class="messages"></div>
            <form id="adminMessageForm" class="message-form">
              <input id="adminMessageInput" placeholder="Ketik balasan..." required>
              <button class="btn">Kirim</button>
            </form>
            <div class="admin-actions">
              <select id="statusSelect">
                <option value="Menunggu">Menunggu</option>
                <option value="Dilayani">Sedang dilayani</option>
                <option value="Selesai">Selesai</option>
              </select>
              <button id="closeChatBtn" class="btn ghost">Tutup Chat</button>
            </div>
          </div>

          <div class="panel" id="productsPanel">
            <h3>Produk</h3>
            <form id="productForm">
              <input id="pId" placeholder="ID produk" required>
              <input id="pName" placeholder="Nama produk" required>
              <input id="pPrice" placeholder="Harga" required>
              <input id="pDuration" placeholder="Durasi" required>
              <select id="pStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select>
              <input id="pNote" placeholder="Catatan">
              <button class="btn">Simpan Produk</button>
            </form>
            <div id="productsList"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="chat-footer">
      <small>KingDigitalPremium Admin</small>
    </footer>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
